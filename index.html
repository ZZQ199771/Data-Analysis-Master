      border: 1px solid #cbd5e1;
      border-radius: 14px;

    function isLikelyCozeElement(el) {
      if (!(el instanceof HTMLElement)) return false;
      if (el === mount || el === loading) return false;
      if (el.closest && el.closest(".page")) return false;

      const raw = [
        el.className || "",
        el.id || "",
        el.getAttribute("title") || "",
        el.getAttribute("src") || "",
        el.getAttribute("aria-label") || ""
      ].join(" ").toLowerCase();

      if (raw.includes("coze")) return true;
      if (el.tagName === "IFRAME" && raw.includes("coze")) return true;

      const style = window.getComputedStyle(el);
      const z = Number(style.zIndex);
      if ((style.position === "fixed" || style.position === "absolute") && z >= 1000) return true;

      return false;
    }

    function fitElementIntoMount(el) {
      if (!el || el.parentElement === mount) return;

      mount.appendChild(el);

      el.style.position = "absolute";
      el.style.inset = "0";
      el.style.width = "100%";
      el.style.height = "100%";
      el.style.maxWidth = "none";
      el.style.maxHeight = "none";
      el.style.minWidth = "0";
      el.style.minHeight = "0";
      el.style.transform = "none";
      el.style.zIndex = "20";
      el.style.borderRadius = "0";
      el.style.boxShadow = "none";
      el.style.display = "block";
      el.style.opacity = "1";
      el.style.visibility = "visible";

      loading.style.display = "none";
      statusEl.textContent = "已加载";
    }

    function scanAndMoveCozeElements() {
      const bodyChildren = Array.from(document.body.children);
      for (const el of bodyChildren) {
        if (isLikelyCozeElement(el)) fitElementIntoMount(el);
      }

      const iframes = Array.from(document.querySelectorAll("iframe"));
      for (const iframe of iframes) {
        if (isLikelyCozeElement(iframe)) fitElementIntoMount(iframe);
      }
    }

    function showError(message) {
      statusEl.textContent = "加载失败";
      loading.style.display = "grid";

    function initCoze(key) {
      const agent = AGENTS[key];

        setTimeout(scanAndMoveCozeElements, 3000);
        setTimeout(scanAndMoveCozeElements, 5000);
      } catch (error) {
        console.error(error);
        showError("智能体初始化失败，请检查 token、projectId 或网络。");
      }
    }

    const observer = new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        for (const node of mutation.addedNodes) {
          if (isLikelyCozeElement(node)) fitElementIntoMount(node);
          if (node instanceof HTMLElement) {
            const children = Array.from(node.querySelectorAll ? node.querySelectorAll("*") : []);
            for (const child of children) {
              if (isLikelyCozeElement(child)) {
                fitElementIntoMount(child);
                break;
              }
            }
          }
        }
      }
    });

    function downloadEmbeddedFile(key) {
      const file = EMBEDDED_DATA_FILES[key];
      if (!file) return;

      const binary = atob(file.base64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }

      const blob = new Blob([bytes], { type: file.mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = file.filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    document.querySelectorAll(".download-item").forEach((button) => {
      button.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        downloadEmbeddedFile(button.dataset.fileKey);
        dataDownload.open = false;
      });
    });

    agentSelect.addEventListener("change", () => {
      const key = agentSelect.value;
      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set("agent", key);
      window.location.href = nextUrl.toString();
    });

    window.addEventListener("load", () => {
      renderAgentInfo(initialAgentKey);
      observer.observe(document.body, { childList: true, subtree: true });
      initCoze(initialAgentKey);
    });
  </script>
